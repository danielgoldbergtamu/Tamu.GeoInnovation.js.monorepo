<tamu-gisc-tooltip [width]="'20rem'" [positioningStrategy]="'fixed'">
  <tamu-gisc-tooltip-trigger>
    <p>
      @if (showIcon()) {
      <span class="material-icons">{{iconName()}}</span>
      } {{value | date : formatString()}}
    </p>
  </tamu-gisc-tooltip-trigger>

  @if (kind !== 'time') {
  <div class="date-time-picker-field">
    <input class="date-time-picker-input date-time-picker-date" [matDatepicker]="datepicker" [value]="fieldValue" (dateChange)="handleDatePicked($event.value)" placeholder="MM/DD/YYYY" aria-label="Date" />
    <mat-datepicker-toggle class="date-time-picker-date-toggle" [for]="datepicker"></mat-datepicker-toggle>
    <mat-datepicker #datepicker panelClass="tamu-gisc-date-time-picker-panel" (closed)="pickerClosed('date')"></mat-datepicker>
  </div>
  } @if (kind !== 'date') {
  <div class="date-time-picker-field">
    <input class="date-time-picker-input date-time-picker-time" [matTimepicker]="timepicker" [value]="fieldValue" (valueChange)="handleTimePicked($event)" placeholder="HH:MM AM" aria-label="Time" />
    <mat-timepicker-toggle class="date-time-picker-time-toggle" [for]="timepicker"></mat-timepicker-toggle>
    <mat-timepicker #timepicker [interval]="interval" panelClass="tamu-gisc-date-time-picker-panel" (closed)="pickerClosed('time')"></mat-timepicker>
  </div>
  }
</tamu-gisc-tooltip>
