<!-- `tamuGiscRevealSidebarOnPopup`: the feature popup renders inside this panel, so a closed panel
swallows it and clicking a feature appears to do nothing (#1244). -->
<tamu-gisc-sidebar [position]="'right'" tamuGiscRevealSidebarOnPopup>
  <div class="tabs left">
    <!-- The main map's tabs, from the same list (`sidebar-tabs.ts`, #2758), less any this map leaves out (`sidebarTabs`). -->
    @for (tab of tabs; track tab.id) { @if (showTab(tab.id) && (!tab.developmentOnly || (isDev | async) === true)) {
    <tamu-gisc-sidebar-tab [title]="tab.title" [description]="tab.description" [material_icon]="tab.material_icon" [route]="tab.route"></tamu-gisc-sidebar-tab>
    } }
  </div>

  <div class="content">
    @if (!configuration?.brandingIconUrl) {
    <tamu-gisc-tamu-block></tamu-gisc-tamu-block>
    } @else {
    <img class="campus-branding-icon" [src]="$safeNavigationMigration(configuration?.brandingIconUrl)" [alt]="$safeNavigationMigration(configuration?.applicationName)" />
    }
    <router-outlet></router-outlet>
    <tamu-gisc-feature-popup></tamu-gisc-feature-popup>
  </div>
</tamu-gisc-sidebar>
